<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawiwahan — Restu &amp; Bawantari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14100D;
  --ink-2:#1F1712;
  --gold:#C9A24B;
  --gold-lt:#EBD49A;
  --crimson:#7E2B2A;
  --ivory:#F3E9DA;
  --fade:1600ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{
  font-family:'Marcellus',Georgia,'Times New Roman',serif;
  color:var(--ivory);
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink)}

/* ---------- blurred ambient backdrop ---------- */
.backdrop{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(48px) saturate(.7) brightness(.28);
  transform:scale(1.15);opacity:0;transition:opacity var(--fade) ease;
}
.backdrop.on{opacity:1}

/* ---------- photo frame ---------- */
.frame{
  position:relative;
  aspect-ratio:1920/1277;
  width:min(100vw, calc(100vh * 1920 / 1277));
  max-height:100vh;
  overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.75);
}
.slide{position:absolute;inset:0;opacity:0;transition:opacity var(--fade) ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.slide.on img{animation-duration:var(--dur);animation-timing-function:linear;animation-fill-mode:forwards}
.slide.on.kb1 img{animation-name:kb1}
.slide.on.kb2 img{animation-name:kb2}
.slide.on.kb3 img{animation-name:kb3}
@keyframes kb1{from{transform:scale(1.005)}to{transform:scale(1.11)}}
@keyframes kb2{from{transform:scale(1.13) translate(1.5%,.5%)}to{transform:scale(1.01) translate(0,0)}}
@keyframes kb3{from{transform:scale(1.04) translate(-1.5%,1%)}to{transform:scale(1.14) translate(1.5%,-1%)}}

/* warm vignette + hairline frame */
.frame::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 140px 40px rgba(10,7,5,.55), inset 0 0 0 1px rgba(201,162,75,.28);
}

/* ---------- caption ---------- */
.caption{
  position:absolute;left:0;right:0;bottom:0;padding:clamp(20px,5vh,60px) clamp(24px,5vw,72px);
  background:linear-gradient(to top,rgba(12,8,6,.82),rgba(12,8,6,0));
  opacity:0;transform:translateY(14px);transition:opacity 1100ms ease 500ms,transform 1100ms ease 500ms;
  pointer-events:none;
}
.slide.on .caption{opacity:1;transform:none}
.caption .idx{
  font-family:'Marcellus SC',Georgia,serif;font-size:clamp(9px,1vw,12px);
  letter-spacing:.34em;color:var(--gold);display:block;margin-bottom:.5em;
}
.caption .txt{font-size:clamp(15px,2.2vw,30px);color:var(--ivory);letter-spacing:.02em}

/* ---------- title / closing cards ---------- */
.card{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  opacity:0;transition:opacity var(--fade) ease;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,rgba(20,16,13,.72) 0%,rgba(12,9,7,.94) 70%);
}
.card.on{opacity:1}
.card .inner{padding:0 8vw;max-width:1100px}
.eyebrow{
  font-family:'Marcellus SC',Georgia,serif;color:var(--gold);
  font-size:clamp(10px,1.25vw,15px);letter-spacing:.46em;margin-bottom:clamp(18px,3.4vh,40px);
}
.names{line-height:1.14}
.names span{display:block;font-size:clamp(30px,6.4vw,86px);letter-spacing:.03em;color:var(--ivory)}
.amp{
  font-family:'Marcellus SC',serif;color:var(--gold-lt);
  font-size:clamp(16px,2.4vw,30px)!important;margin:clamp(6px,1.4vh,16px) 0;letter-spacing:.3em
}
.date{
  font-family:'Marcellus SC',Georgia,serif;color:rgba(243,233,218,.72);
  font-size:clamp(10px,1.25vw,15px);letter-spacing:.34em;margin-top:clamp(18px,3.2vh,38px)
}
.thanks{font-size:clamp(15px,2vw,24px);color:rgba(243,233,218,.78);line-height:1.7;margin-top:1.2em}

/* ---------- signature: pepatran ornament ---------- */
.orn{width:clamp(210px,30vw,380px);height:auto;display:block;margin:clamp(16px,3vh,34px) auto;overflow:visible}
.orn path,.orn line{stroke:var(--gold);fill:none;stroke-width:1.25;stroke-linecap:round}
.orn .petal{fill:var(--gold);stroke:none}
.card.on .orn path,.card.on .orn line{
  stroke-dasharray:var(--len,320);stroke-dashoffset:var(--len,320);
  animation:draw 2200ms cubic-bezier(.32,.72,.3,1) 380ms forwards;
}
.card.on .orn .petal{opacity:0;animation:bloom 1000ms ease 1800ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bloom{to{opacity:1}}

/* ---------- start screen ---------- */
#start{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;
  background:var(--ink);transition:opacity 700ms ease
}
#start .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(26px) brightness(.3) saturate(.65);transform:scale(1.1)}
#start .inner{position:relative;padding:0 8vw;max-width:800px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:clamp(26px,4.5vh,46px)}
button.act{
  font-family:'Marcellus SC',Georgia,serif;font-size:clamp(11px,1.15vw,14px);letter-spacing:.24em;
  color:var(--gold-lt);background:transparent;border:1px solid rgba(201,162,75,.5);
  padding:16px 30px;cursor:pointer;transition:background 260ms ease,color 260ms ease,border-color 260ms ease;
}
button.act:hover,button.act:focus-visible{background:rgba(201,162,75,.14);border-color:var(--gold);color:#fff}
button.act.quiet{color:rgba(243,233,218,.6);border-color:rgba(243,233,218,.22)}
.hint{margin-top:clamp(20px,3.4vh,36px);font-size:12px;letter-spacing:.16em;color:rgba(243,233,218,.38);font-family:'Marcellus SC',serif}

/* ---------- controls ---------- */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:15;padding:18px 22px;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(to top,rgba(10,7,5,.7),transparent);
  opacity:0;transition:opacity 400ms ease;
}
#bar.show{opacity:1}
#bar button{
  background:transparent;border:0;color:rgba(243,233,218,.8);cursor:pointer;
  width:42px;height:42px;display:grid;place-items:center;border-radius:50%;transition:background 200ms,color 200ms
}
#bar button:hover,#bar button:focus-visible{background:rgba(201,162,75,.18);color:#fff}
#bar svg{width:20px;height:20px;fill:currentColor}
#prog{position:fixed;left:0;bottom:0;height:2px;background:var(--gold);width:0;z-index:16;transition:width 120ms linear}
.hidecursor{cursor:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .slide.on img{animation:none!important}
  .card.on .orn path,.card.on .orn line{animation:none;stroke-dashoffset:0}
  .card.on .orn .petal{animation:none;opacity:1}
}
</style>
</head>
<body>

<div id="stage">
  <div class="backdrop" id="bd"></div>
  <div class="frame" id="frame"></div>

  <!-- title card -->
  <div class="card" id="cardIn">
    <div class="inner">
      <div class="eyebrow" id="eyebrow">PAWIWAHAN</div>
      <div class="names">
        <span id="nGroom"></span>
        <span class="amp">&amp;</span>
        <span id="nBride"></span>
      </div>
      <svg class="orn" viewBox="0 0 200 40" aria-hidden="true">
        <g id="ornG"></g>
      </svg>
      <div class="date" id="dateIn"></div>
    </div>
  </div>

  <!-- closing card -->
  <div class="card" id="cardOut">
    <div class="inner">
      <div class="eyebrow">MATUR SUKSMA</div>
      <svg class="orn" viewBox="0 0 200 40" aria-hidden="true"><g id="ornG2"></g></svg>
      <p class="thanks" id="thanksTxt"></p>
    </div>
  </div>
</div>

<div id="prog"></div>

<div id="bar">
  <button id="bPlay" title="Jeda (spasi)" aria-label="Jeda"></button>
  <button id="bPrev" title="Sebelumnya" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M18 6v12l-9-6zM7 6h2v12H7z"/></svg></button>
  <button id="bNext" title="Berikutnya" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM15 6h2v12h-2z"/></svg></button>
  <button id="bMute" title="Musik (M)" aria-label="Matikan musik"></button>
  <button id="bFull" title="Layar penuh (F)" aria-label="Layar penuh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 3v-3h2v5h-5v-2z"/></svg></button>
</div>

<div id="start">
  <div class="bg" id="startBg"></div>
  <div class="inner">
    <div class="eyebrow">PAWIWAHAN &middot; UPACARA ADAT BALI</div>
    <div class="names">
      <span id="sGroom"></span>
      <span class="amp">&amp;</span>
      <span id="sBride"></span>
    </div>
    <svg class="orn" viewBox="0 0 200 40" aria-hidden="true"><g id="ornG3"></g></svg>
    <div class="btns">
      <button class="act" id="goSound">PUTAR DENGAN MUSIK</button>
      <button class="act quiet" id="goSilent">TANPA MUSIK</button>
    </div>
    <p class="hint">Tekan F untuk layar penuh &middot; Spasi untuk jeda</p>
  </div>
</div>

/* ---------- ornamen pepatran (SVG digambar via JS agar mudah dipakai ulang) ---------- */
const ORN = `
<path d="M108 20 C120 20 125 11 137 11 C149 11 154 20 147.5 24 C142 27.4 137 22.6 140.5 18.6" />
<path d="M92 20 C80 20 75 11 63 11 C51 11 46 20 52.5 24 C58 27.4 63 22.6 59.5 18.6" />
<line x1="158" y1="20" x2="198" y2="20" />
<line x1="42" y1="20" x2="2" y2="20" />
<path class="petal" d="M100 8 C104.6 13.5 104.6 26.5 100 32 C95.4 26.5 95.4 13.5 100 8 Z" />
<path class="petal" d="M88 20 C93.5 15.6 106.5 15.6 112 20 C106.5 24.4 93.5 24.4 88 20 Z" />`;
["ornG","ornG2","ornG3"].forEach(id=>{ const g=document.getElementById(id); if(g) g.innerHTML=ORN; });
document.querySelectorAll('.orn path:not(.petal), .orn line').forEach(el=>{
  try{ el.style.setProperty('--len', Math.ceil(el.getTotalLength ? el.getTotalLength() : 60) + 'px'); }catch(e){}
});

/* ---------- isi teks ---------- */
const $ = id => document.getElementById(id);
$('nGroom').textContent = $('sGroom').textContent = CONFIG.groom;
$('nBride').textContent = $('sBride').textContent = CONFIG.bride;
$('dateIn').textContent = CONFIG.date;
$('thanksTxt').innerHTML = CONFIG.thanks;
$('startBg').style.backgroundImage = `url(${CONFIG.photos[0].src})`;

/* ---------- bangun slide ---------- */
const frame = $('frame');
CONFIG.photos.forEach((p,i)=>{
  const d = document.createElement('div');
  d.className = 'slide ' + p.kb;
  d.style.setProperty('--dur', (CONFIG.photoSec + 2.2) + 's');
  d.innerHTML = `<img src="${p.src}" alt="Foto pernikahan ${i+1}">
    <div class="caption"><span class="idx">${String(i+1).padStart(2,'0')} / ${String(CONFIG.photos.length).padStart(2,'0')}</span>
    <span class="txt">${p.caption||''}</span></div>`;
  frame.appendChild(d);
});
const slideEls = [...frame.querySelectorAll('.slide')];

/* ---------- timeline ---------- */
const TL = [
  { type:'card', el:$('cardIn'), dur:CONFIG.titleSec, bg:CONFIG.photos[0].src },
  ...CONFIG.photos.map((p,i)=>({ type:'photo', i, dur:CONFIG.photoSec, bg:p.src })),
  { type:'card', el:$('cardOut'), dur:CONFIG.closeSec, bg:CONFIG.photos[CONFIG.photos.length-1].src }
];
const TOTAL = TL.reduce((s,x)=>s+x.dur,0);

let cur=-1, elapsed=0, before=0, paused=false, raf=null, last=0, started=false;

function clearAll(){
  slideEls.forEach(s=>s.classList.remove('on'));
  $('cardIn').classList.remove('on'); $('cardOut').classList.remove('on');
}
function show(n){
  cur = n; elapsed = 0;
  before = TL.slice(0,n).reduce((s,x)=>s+x.dur,0);
  clearAll();
  const step = TL[n];
  $('bd').style.backgroundImage = `url(${step.bg})`;
  $('bd').classList.add('on');
  if(step.type==='card'){ void step.el.offsetWidth; step.el.classList.add('on'); }
  else{
    const s = slideEls[step.i];
    s.classList.remove('kb1','kb2','kb3');
    void s.offsetWidth;
    s.classList.add(CONFIG.photos[step.i].kb,'on');
  }
}
function advance(){
  if(cur+1 < TL.length) show(cur+1);
  else if(CONFIG.loop) show(0);
  else { paused=true; setPlayIcon(); fadeMusic(0); }
}
function loopFn(ts){
  if(!last) last = ts;
  const dt = (ts-last)/1000; last = ts;
  if(!paused){
    elapsed += dt;
    $('prog').style.width = Math.min(100,((before+elapsed)/TOTAL)*100) + '%';
    if(elapsed >= TL[cur].dur) advance();
  }
  raf = requestAnimationFrame(loopFn);
}

/* ---------- kontrol ---------- */
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>';
const ICON_SND   = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 010 7l1.4 1.4a7 7 0 000-9.8z"/></svg>';
const ICON_MUTE  = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9.9l1.4-1.4 5 5-1.4 1.4z" /><path d="M22.4 9.9L23.8 11.3l-5 5-1.4-1.4z"/></svg>';
function setPlayIcon(){ $('bPlay').innerHTML = paused ? ICON_PLAY : ICON_PAUSE; }

function togglePlay(){
  paused = !paused;
  document.querySelectorAll('.slide img, .orn path, .orn line, .orn .petal')
    .forEach(el=> el.style.animationPlayState = paused ? 'paused' : 'running');
  if(actx){ paused ? actx.suspend() : actx.resume(); }
  setPlayIcon();
}
$('bPlay').onclick = togglePlay;
$('bNext').onclick = ()=> advance();
$('bPrev').onclick = ()=> show(cur>0 ? cur-1 : 0);
$('bFull').onclick = toggleFull;
$('bMute').onclick = toggleMute;

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
addEventListener('keydown', e=>{
  if(!started) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowRight') advance();
  if(e.code==='ArrowLeft') show(cur>0?cur-1:0);
  if(e.key.toLowerCase()==='f') toggleFull();
  if(e.key.toLowerCase()==='m') toggleMute();
});

/* auto-hide kontrol */
let hideT;
function poke(){
  $('bar').classList.add('show'); document.body.classList.remove('hidecursor');
  clearTimeout(hideT);
  hideT = setTimeout(()=>{ $('bar').classList.remove('show'); document.body.classList.add('hidecursor'); }, 2800);
}
addEventListener('mousemove', poke); addEventListener('touchstart', poke);

/* =====================================================================
   MUSIK — komposisi asli, disintesis langsung di browser (bebas hak cipta)
   Nada lonceng bernuansa gamelan di atas pad hangat, F mayor, 66 BPM
   ===================================================================== */
let actx=null, master=null, busBell=null, busPad=null, muted=false, schedTimer=null, nextLoopT=0;
const BPM=66, SPB=60/BPM, LOOP_BEATS=16;

function makeReverb(ctx, sec=3.2){
  const len = Math.floor(ctx.sampleRate*sec);
  const buf = ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d = buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.8);
  }
  const c = ctx.createConvolver(); c.buffer = buf; return c;
}
function initAudio(){
  actx = new (window.AudioContext||window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0;
  const verb = makeReverb(actx), wet = actx.createGain(), dry = actx.createGain();
  wet.gain.value = .42; dry.gain.value = .72;
  busBell = actx.createGain(); busBell.gain.value = .9;
  busPad  = actx.createGain(); busPad.gain.value  = .55;
  const mix = actx.createGain();
  busBell.connect(mix); busPad.connect(mix);
  mix.connect(dry); mix.connect(verb); verb.connect(wet);
  dry.connect(master); wet.connect(master);
  master.connect(actx.destination);
  master.gain.setTargetAtTime(.55, actx.currentTime, 1.6);
}
function fadeMusic(v){ if(master) master.gain.setTargetAtTime(v, actx.currentTime, .8); }
function toggleMute(){
  if(!actx) return;
  muted = !muted; fadeMusic(muted?0:.55);
  $('bMute').innerHTML = muted ? ICON_MUTE : ICON_SND;
}

/* lonceng: fundamental + parsial inharmonis, meluruh panjang */
function bell(t, f, g, dur){
  [[1,1],[2.0,.40],[2.76,.20],[4.07,.09]].forEach(([r,a])=>{
    const o=actx.createOscillator(), gn=actx.createGain();
    o.type='sine'; o.frequency.value=f*r;
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(Math.max(g*a,.0002), t+.006);
    gn.gain.exponentialRampToValueAtTime(.0001, t + dur/(1+(r-1)*.45));
    o.connect(gn); gn.connect(busBell); o.start(t); o.stop(t+dur+.2);
  });
}
/* pad hangat */
function pad(t, freqs, dur){
  const f=actx.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(520,t); f.frequency.linearRampToValueAtTime(900,t+dur*.5);
  const g=actx.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(.075,t+dur*.35);
  g.gain.linearRampToValueAtTime(.0001,t+dur);
  f.connect(g); g.connect(busPad);
  freqs.forEach(fr=>{
    [-4,4].forEach(det=>{
      const o=actx.createOscillator(); o.type='triangle';
      o.frequency.value=fr; o.detune.value=det;
      o.connect(f); o.start(t); o.stop(t+dur+.2);
    });
  });
}
/* bass lembut */
function bass(t,f,dur){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(.16,t+.18);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(busPad); o.start(t); o.stop(t+dur+.2);
}

const BARS = [
  { pad:[349.23,440.00,523.25], bass:174.61, arp:[349.23,440.00,523.25,698.46] }, // F
  { pad:[329.63,392.00,523.25], bass:164.81, arp:[329.63,392.00,523.25,659.25] }, // C/E
  { pad:[293.66,349.23,440.00], bass:146.83, arp:[293.66,349.23,440.00,587.33] }, // Dm
  { pad:[293.66,349.23,466.16], bass:116.54, arp:[233.08,293.66,349.23,466.16] }  // Bb
];
const ARP_SHAPE = [0,1,2,3,2,1,2,3];
const LEAD = [ [0,523.25],[2.5,698.46],[4,659.25],[6,783.99],
               [8,698.46],[9.5,659.25],[10,587.33],[12,587.33],[14,523.25] ];

function scheduleLoop(t0){
  BARS.forEach((bar,b)=>{
    const bt = t0 + b*4*SPB;
    pad(bt, bar.pad, 4*SPB*0.98);
    bass(bt, bar.bass, 3.4*SPB);
    ARP_SHAPE.forEach((idx,k)=> bell(bt + k*0.5*SPB, bar.arp[idx], .075, 2.4));
  });
  LEAD.forEach(([beat,f])=> bell(t0 + beat*SPB, f, .115, 3.4));
}
function startMusic(){
  initAudio();
  nextLoopT = actx.currentTime + .25;
  schedTimer = setInterval(()=>{
    if(actx.state!=='running') return;
    while(nextLoopT < actx.currentTime + 1.2){
      scheduleLoop(nextLoopT);
      nextLoopT += LOOP_BEATS*SPB;
    }
  }, 250);
  $('bMute').innerHTML = ICON_SND;
}

/* ---------- mulai ---------- */
function begin(withSound){
  started = true;
  const s = $('start');
  s.style.opacity = 0;
  setTimeout(()=> s.remove(), 720);
  if(withSound){ try{ startMusic(); }catch(e){ $('bMute').innerHTML=ICON_MUTE; } }
  else { muted=true; $('bMute').innerHTML = ICON_MUTE; }
  setPlayIcon();
  show(0);
  raf = requestAnimationFrame(loopFn);
  poke();
}
$('goSound').onclick = ()=> begin(true);
$('goSilent').onclick = ()=> begin(false);
$('bMute').innerHTML = ICON_MUTE;
setPlayIcon();
</script>
